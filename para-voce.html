<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para você ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2a0a1f;--bg2:#08020a;--rose:#ff4d79;--soft:#ffd6e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,var(--bg1),var(--bg2) 75%);font-family:'Quicksand',system-ui,sans-serif;color:var(--soft)}
canvas{position:fixed;inset:0;width:100%;height:100%}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:24px;transition:opacity 1.2s,transform 1.2s;z-index:5}
#intro.out{opacity:0;transform:scale(1.15);pointer-events:none}
#intro p{font-size:1.05rem;letter-spacing:.08em;opacity:0;animation:fi 1.6s .3s forwards}
#go{font:600 1.1rem 'Quicksand',sans-serif;color:#fff;background:linear-gradient(135deg,#ff4d79,#c2185b);border:0;border-radius:50px;padding:16px 38px;cursor:pointer;box-shadow:0 0 0 0 rgba(255,77,121,.6);animation:fi 1.6s 1.2s forwards,pl 2s 2.8s infinite;opacity:0}
#go:active{transform:scale(.95)}
.env{font-size:4.2rem;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,77,121,.7))}
#msg{position:fixed;left:0;right:0;top:70%;text-align:center;z-index:4;padding:0 16px;pointer-events:none}
#txt{font-family:'Great Vibes','Brush Script MT',cursive;font-size:clamp(3rem,15vw,6.5rem);color:#fff;text-shadow:0 0 14px var(--rose),0 0 40px var(--rose);line-height:1.1}
#txt span{display:inline-block;opacity:0;transform:translateY(24px) scale(.6) rotate(-8deg);filter:blur(8px);animation:lt 1s cubic-bezier(.2,.9,.3,1.3) forwards}
#sub{margin-top:14px;font-size:1rem;opacity:0;letter-spacing:.06em}
#sub.on{animation:fi 2s forwards}
#again{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:.8rem;opacity:0;z-index:6;cursor:pointer}
#again.on{animation:fi 2s 1s forwards}
@keyframes fi{to{opacity:.9}}
@keyframes lt{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fl{50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,77,121,.6)}100%{box-shadow:0 0 0 26px rgba(255,77,121,0)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro">
  <div class="env">💌</div>
  <p>Fiz uma coisa especial pra você…</p>
  <button id="go">Toque para abrir</button>
</div>
<div id="msg"><div id="txt"></div><div id="sub">Você é a melhor parte dos meus dias.</div></div>
<div id="again">toque na tela para rever ♥</div>
<script>
(function(){
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,cx,cy,S,P=[],F=[],t0=0,run=false,shown=false;
function clamp(v){return v<0?0:v>1?1:v}
function eo(p){return 1-Math.pow(1-p,3)}
function build(){
  var d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
  cx=W/2;cy=H*.38;S=Math.min(W*.78,H*.46)/34;P=[];
  var N=W<600?900:1400,R=Math.max(W,H);
  for(var i=0;i<N;i++){
    var t=Math.random()*6.2832,r=i<N*.3?1:Math.sqrt(Math.random())*.97;
    var tx=16*Math.pow(Math.sin(t),3)*S*r,ty=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*S*r;
    var a=Math.random()*6.2832,rad=R*(.55+Math.random()*.6);
    P.push({tx:tx,ty:ty,sx:Math.cos(a)*rad,sy:Math.sin(a)*rad,k:(Math.random()<.5?-1:1)*(2.5+Math.random()*4),
      dl:Math.random()*1800,du:3200+Math.random()*1800,z:1+Math.random()*2.2,h:335+Math.random()*25,l:58+Math.random()*22,ph:Math.random()*6.28});
  }
}
function frame(now){
  if(!run)return;
  var t=now-t0;
  x.globalCompositeOperation='source-over';
  x.fillStyle='rgba(8,2,10,.28)';x.fillRect(0,0,W,H);
  x.globalCompositeOperation='lighter';
  var done=clamp((t-5200)/1200),pulse=t>5200?1+.035*Math.sin(t/190)*done:1;
  for(var i=0;i<P.length;i++){
    var p=P[i],e=eo(clamp((t-p.dl)/p.du)),vx=p.sx+(p.tx*pulse-p.sx)*e,vy=p.sy+(p.ty*pulse-p.sy)*e;
    var an=(1-e)*p.k,co=Math.cos(an),si=Math.sin(an);
    var px=cx+vx*co-vy*si,py=cy+vx*si+vy*co;
    var tw=.65+.35*Math.sin(t/260+p.ph);
    x.fillStyle='hsla('+p.h+',95%,'+p.l+'%,'+(.35+.65*tw)+')';
    x.beginPath();x.arc(px,py,p.z*(e<1?1:tw*1.15),0,6.2832);x.fill();
  }
  if(t>5200&&Math.random()<.12)F.push({x:Math.random()*W,y:H+20,v:.6+Math.random()*1.4,s:10+Math.random()*16,a:Math.random()*6.28});
  x.globalCompositeOperation='source-over';
  for(var j=F.length-1;j>=0;j--){
    var f=F[j];f.y-=f.v;f.a+=.02;
    if(f.y<-30){F.splice(j,1);continue}
    x.globalAlpha=.55*clamp(f.y/H+.2);x.fillStyle='#ff6b94';
    x.font=f.s+'px sans-serif';x.fillText('♥',f.x+Math.sin(f.a)*18,f.y);
  }
  x.globalAlpha=1;
  if(t>5600&&!shown){shown=true;write()}
  requestAnimationFrame(frame);
}
function write(){
  var el=document.getElementById('txt');el.innerHTML='';
  'Eu te amo'.split('').forEach(function(ch,i){
    var s=document.createElement('span');s.textContent=ch===' '?'\u00a0':ch;s.style.animationDelay=(i*.14)+'s';el.appendChild(s);
  });
  setTimeout(function(){document.getElementById('sub').classList.add('on');document.getElementById('again').classList.add('on')},1700);
}
function start(){
  document.getElementById('intro').classList.add('out');
  document.getElementById('sub').className='';document.getElementById('again').className='';
  document.getElementById('txt').innerHTML='';
  F=[];shown=false;build();x.fillStyle='#08020a';x.fillRect(0,0,W,H);
  t0=performance.now();run=true;requestAnimationFrame(frame);
}
document.getElementById('go').addEventListener('click',start);
document.getElementById('again').addEventListener('click',function(e){e.stopPropagation();if(shown)start()});
addEventListener('resize',function(){if(!run)return;var t=performance.now()-t0;build();});
build();
})();
</script>
</body>
</html>
